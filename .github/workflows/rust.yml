name: Rust

on:
  push:
    branches:
      - main
      - lapsphere
  pull_request:
    branches:
      - main
      - lapsphere

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential
          sudo apt-get install -y \
            cargo \
            rustc \
            libdbus-1-dev \
            pkg-config \
            libgtk-3-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libatk1.0-dev \
            libgraphene-1.0-dev \
            libwayland-dev \
            libxkbcommon-dev

    - name: Clean the project
      run: cargo clean 

    - name: Run tests
      run: cargo test

    - name: Build Debian package
      run: |
          dpkg-buildpackage -b -uc -us
          mkdir artifacts
          cp ../lapsphere_*.deb artifacts/

    - name: Upload Debian package
      uses: actions/upload-artifact@v7
      with:
        name: lapsphere-ubuntu-24.04-deb
        path: artifacts/*.deb
        retention-days: 90
        compression-level: 0

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Update Arch Linux
      run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rustup pkgconf dbus gtk3 libadwaita pango cairo gdk-pixbuf2 atk graphene wayland libxkbcommon git sudo

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build Arch Linux package
      run: |
          # Create source tarball
          tar -czf ../lapsphere-0.1.0.tar.gz --transform 's,^,lapsphere-0.1.0/,' --exclude=.git .
          mv ../lapsphere-0.1.0.tar.gz .

          # makepkg doesn't like being root
          useradd -m builduser
          chown -R builduser .
          # Allow builduser to run pacman without password for dependencies
          echo "builduser ALL=(ALL) NOPASSWD: /usr/bin/pacman" >> /etc/sudoers

          # Run makepkg as builduser
          # --noconfirm: don't ask questions
          # -s: install dependencies
          su builduser -c "rustup default stable && makepkg --noconfirm -s"

    - name: Upload Arch package
      uses: actions/upload-artifact@v7
      with:
        name: lapsphere-arch-pkg
        path: "*.pkg.tar.zst"
        retention-days: 90
        compression-level: 0
