[package]
name = "lapsphere"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core egui
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true, features = ["svg", "image"] }
egui_plot.workspace = true

# Your existing dependencies
lapsphere-common.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
ureq = { version = "2.12", default-features = false, features = ["json", "gzip", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
webbrowser.workspace = true

# Async for DBus
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
zbus.workspace = true

# Replace glibc malloc with mimalloc: glibc's per-thread arena pool retains
# freed-but-unused memory (up to 64 MB per arena, one per malloc-thread) and
# never returns it to the OS. Under the GUI's ~8k alloc/s D-Bus polling load
# that arena ratchet accumulated ~8 GB of resident-but-free heap over hours
# (see heaptrack probe: real Rust heap stayed at 27 MB peak / 22 MB leaked
# while RSS grew to 3.6 GB). mimalloc bounds arenas and reuses freed blocks,
# eliminating the retention entirely.
mimalloc = { version = "0.1", default-features = false, features = ["extended"] }

# Time handling
chrono.workspace = true
ksni = { version = "0.3.3", features = ["blocking"] }

# System statistics
systemstat.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
